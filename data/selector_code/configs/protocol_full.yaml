  # --- THE paper's model + its switch-attribution control ---------------------
  # Both blocks are field-for-field identical to the DEFAULT `cgrv` spec above
  # except for (a) the EXP7 gate-fix switches named in `gate_fix_switches` and
  # (b) model.typed_relations = false.  Asserted by
  # tests/test_final_model.py::test_final_model_methods_are_cgrv_plus_declared_switches.
  #
  # cgrv_final = gate-fix (A)+(B)+(C) AND typed_relations OFF.  Why each choice:
  #   * (A) supervised per-source confidence head tied to the gate logit
  #     [loss_weights.source_conf] — outputs/verdict/gate_fix.md, VERDICT FIXED:
  #     without it g_R is a constant (std 1.26e-05, covered_v2 AUC .431, i.e.
  #     INVERTED) and the design's veto p_contra_CR x g_R is a no-op.
  #   * (B) gate-input z-scoring [model.gate_standardize] and (C) gate-logit L2
  #     [loss_weights.gate_l2] — same verdict: A alone COLLAPSES the second
  #     diagonal (AUC(g_P, familiarity) .843 -> .488).  A+B+C is the ONLY sweep
  #     cell that keeps BOTH diagonals dominant (g_R gap +.198, g_P gap +.367),
  #     which is what the paper's two-boundary (coverage AND familiarity) claim
  #     requires; it costs .007 strict (.740 +/- .014 vs .747 +/- .006).
  #   * typed_relations OFF — outputs/verdict/simplification.md: the typed
  #     4-way relation head is INERT (`cgrv_simple` == `cgrv`, paired t over the
  #     5 seeds p=0.34 on strict), and dropping it removes the 8,550 pairwise
  #     72B-judge silver labels the typed taxonomy needs at training time.
  #     `relation` loss weight is KEPT at 0.3 (the matcher's own binary silver
  #     labels): `cgrv_minimal`, which zeroes it, was significantly worse
  #     (Dstrict -0.026, Dpoison +0.066, harmed on 5/5 seeds).
  cgrv_final:
    kind: cgrv
    final_model: true
    gate_fix_of: cgrv
    gate_fix_switches:
    - A_source_conf
    - B_gate_standardize
    - C_gate_l2
    simplification_of: cgrv
    encoder:
      backend: bge
      model_name: BAAI/bge-base-en-v1.5
      batch_size: 128
      device: auto
      cache_dir: experiments/outputs/emb_cache
      cache: true
    model:
      proj_dim: 64
      rel_hidden: 64
      gate_hidden: 16
      dropout: 0.1
      gates: true
      typed_relations: false
      state_mixture: true
      monotone: true
      gate_standardize: true
    loss_weights:
      primary: 1.0
      recovery: 1.0
      relation: 0.3
      counterfactual: 0.5
      source_conf: 0.3
      gate_l2: 0.01
    optim:
      lr: 0.001
      weight_decay: 0.0001
      batch_size: 256
      max_epochs: 100
      patience: 10
      min_epochs: 5
    counterfactual:
      enabled: true
      margin: 0.2
    calibration:
      enabled: true
      max_iter: 100
    relation_labels: experiments/outputs/relation_labels
    familiarity_dir: experiments/outputs/familiarity

  # Context-only learned arm: both auxiliary channels removed from the rows.
  # Completes the channel grid for the value-of-learning decomposition.

  cgrv_c_only:
    kind: cgrv
    source_ablation_of: cgrv_final
    sources_off: [reference, parametric]
    gate_fix_of: cgrv
    gate_fix_switches:
