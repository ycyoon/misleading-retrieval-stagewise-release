regimes:
  clash_only:
    train_datasets:
    - clash_eval
    split:
      train: 0.7
      dev: 0.15
      test: 0.15
  combined:
    train_datasets:
    - clash_eval
    - raguard
    - ramdocs
    - rgb
    split:
      train: 0.7
      dev: 0.15
      test: 0.15
    note: 'standard train/val/test: group-level 70/15/15 WITHIN each of the 4 datasets;
      train/dev = unions; test = union + per-dataset breakdown. neoqa excluded (2
      conditions only, structural .50 floor) and kept as a separate stress slice;
      ramdocs_primary excluded (subset of ramdocs).'
  lodo:
    datasets:
    - clash_eval
    - raguard
    - ramdocs
    - rgb
    train_dev:
      train: 0.85
      dev: 0.15
    note: 'leave-one-dataset-out over the SAME four datasets as `combined` (raguard
      is now IN the pool; the earlier 3-dataset lodo predates rgb and excluded
      raguard — those runs are archived under outputs/archive/protocol_lodo3_stale).
      Train on the other three with a group-level 85/15 train/dev WITHIN each; the
      held-out dataset is evaluated ENTIRE with dev-frozen thresholds. This is the
      generalization evidence that replaces the harsh clash_only zero-shot setting.'
